name: DBZSSD
options:
  bundleIdPrefix: tw.wujohn
  deploymentTarget:
    iOS: "18.5"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.5"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: SDLHost/Info.plist
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: tw.wujohn.dbzssd
    PRODUCT_NAME: DBZSSD
    CLANG_ENABLE_MODULES: YES
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      - "$(PROJECT_DIR)/Vendor"
targets:
  DBZSSD:
    type: application
    platform: iOS
    sources:
      - path: SDLHost
      - path: ../translations/zh-tw/zh-tw.tsv
        buildPhase: resources
      - path: ../translations/zh-tw/ui-zh-tw.tsv
        buildPhase: resources
      - path: ../translations/zh-tw/fonts/LXGWWenKaiTC-Regular.ttf
        buildPhase: resources
      - path: ../assets/fonts/DotGothic16-Regular.ttf
        buildPhase: resources
      - path: ../assets/fonts/IBMPlexSans-Regular.ttf
        buildPhase: resources
      - path: ../assets/fonts/IBMPlexSans-SemiBold.ttf
        buildPhase: resources
      - path: ../assets/fonts/JetBrainsMono-Regular.ttf
        buildPhase: resources
      - path: ../assets/fonts/ShareTechMono-Regular.ttf
        buildPhase: resources
    dependencies:
      - framework: Vendor/SDL3.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.wujohn.dbzssd
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-force_load"
          - "$(PROJECT_DIR)/../target/aarch64-apple-ios/release/libssd_ios.a"
          - "-framework"
          - "Metal"
          - "-framework"
          - "MetalKit"
          - "-framework"
          - "UIKit"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "QuartzCore"
          - "-framework"
          - "CoreGraphics"
          - "-framework"
          - "CoreVideo"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "CoreBluetooth"
          - "-framework"
          - "CoreHaptics"
          - "-framework"
          - "CoreMotion"
          - "-framework"
          - "OpenGLES"
          - "-framework"
          - "GameController"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "CoreAudio"
          - "-lz"
          - "-lc++"
    preBuildScripts:
      - name: Build Rust game core
        script: |
          set -euo pipefail
          cd "$SRCROOT/.."
          rustup target add aarch64-apple-ios
          cargo build --locked --release --lib -p ssd-app --target aarch64-apple-ios
    postBuildScripts:
      - name: Place Traditional Chinese font in expected folder
        script: |
          set -euo pipefail
          resources="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$resources/fonts"
          cp "$resources/LXGWWenKaiTC-Regular.ttf" "$resources/fonts/LXGWWenKaiTC-Regular.ttf"
    scheme:
      testTargets: []
      gatherCoverageData: false
