[package]
name = "dbz-zhtw-launcher"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "One-file Windows launcher of ssd-recompiled with the zh-TW translation built in"
publish = false

# Standalone: not part of any parent workspace.
[workspace]

[features]
default = []
# Embed dbz102.ips (Klepto v1.02, not ours to distribute): private builds only.
bundle-ips = []
# Builds dbz-update-sign, which signs the update manifest; never part of the launcher.
signer = []

[[bin]]
name = "dbz-zhtw-launcher"
path = "src/main.rs"

[[bin]]
name = "dbz-update-sign"
path = "src/bin/dbz-update-sign.rs"
required-features = ["signer"]

[dependencies]
# Checks the update manifest's signature; 2.2 rather than 3.0, which would add a second sha2 (0.11)
ed25519-dalek = { version = "2.2", default-features = false }
# reads hd-pack.toml (deflated) out of a hd-pack.zip; the version the game workspace locks
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
rfd = "0.15"
sha2 = "0.10"
# The update check and downloads: https through the system's TLS (SChannel on Windows) and root certificates
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

# The progress dialog and the questions: TaskDialogIndirect, looked up at run time (progress.rs); the
# version rfd already uses, no new crate
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
sha2 = "0.10"
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
