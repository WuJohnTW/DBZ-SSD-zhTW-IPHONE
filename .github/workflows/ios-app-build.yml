name: iOS app build

on:
  push:
    branches: [ios-port]
    paths:
      - "ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "translations/zh-tw/**"
      - "assets/fonts/**"
      - ".github/workflows/ios-app-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-app:
    name: Build unsigned iPhone app
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Rust iOS target
        run: |
          rustup target add --toolchain 1.99 aarch64-apple-ios
          xcodebuild -version
          xcodegen --version

      - name: Download official SDL3 iOS framework
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdl" ios/Vendor
          gh release download --repo libsdl-org/SDL --pattern 'SDL3-*.dmg' --dir "$RUNNER_TEMP"
          dmg="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'SDL3-*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/sdl"
          framework="$(find "$RUNNER_TEMP/sdl" -name SDL3.xcframework -type d -print -quit)"
          test -n "$framework"
          ditto "$framework" ios/Vendor/SDL3.xcframework
          hdiutil detach "$RUNNER_TEMP/sdl"
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Build Rust static library
        run: cargo +1.99 build --locked --release --lib -p ssd-app --target aarch64-apple-ios

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project ios/DBZSSD.xcodeproj \
            -scheme DBZSSD \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/DBZSSD.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/DBZSSD.app"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$RUNNER_TEMP/DBZSSD-unsigned.ipa" Payload)
          test -s "$RUNNER_TEMP/DBZSSD-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DBZSSD-unsigned-IPA
          path: ${{ runner.temp }}/DBZSSD-unsigned.ipa
          retention-days: 7

      - name: Upload unsigned app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DBZSSD-unsigned-ios-app
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/DBZSSD.app
          include-hidden-files: true
          retention-days: 7
