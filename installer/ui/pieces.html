<!doctype html>
<!-- The interface pieces of the installer's look (after the original game's dialogue boxes), each drawn alone at a fixed
     place on a transparent page so make_ui.py can cut them out at 1x and 2x. The pieces:
     sky gradient, cream panel with the red-orange double frame and four corner studs, the portrait frame, the ▶ cursor,
     the dark blue button bar. No character art here: the Goku pictures are the wizard/header art. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "LXGW WenKai TC"; src: url("../../translations/zh-tw/fonts/LXGWWenKaiTC-Regular.ttf"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; width: 400px; height: 600px; overflow: hidden; }
.piece { position: absolute; }
/* sky: the page background (stretched at run time to the page) */
#sky { left: 0; top: 0; width: 8px; height: 400px; background: linear-gradient(#2F7FE0 0%, #5DA6F0 58%, #A9D3F8 100%); }
/* panel: cut as nine slices (the studs stick out 6px, the shadow 3px below) */
#frame { left: 40px; top: 20px; width: 120px; height: 100px; background: #FFF3D9; border: 3px solid #B83A06;
  outline: 2px solid #F07A2A; outline-offset: -7px; box-shadow: 0 3px 0 rgba(20,30,70,.35); }
#frame i { position: absolute; width: 10px; height: 10px; background: #E8631A; border: 2px solid #B83A06; box-sizing: content-box; }
#frame i.a { left: -6px; top: -6px; } #frame i.b { right: -6px; top: -6px; }
#frame i.c { left: -6px; bottom: -6px; } #frame i.d { right: -6px; bottom: -6px; }
/* portrait frame: black 3px, cream 3px ring, red 3px ring (cut as nine slices; the picture goes inside) */
#portrait { left: 220px; top: 20px; width: 100px; height: 100px; border: 3px solid #101010; background: #000;
  box-shadow: 0 0 0 3px #FFF3D9, 0 0 0 6px #B83A06; }
/* ▶ cursor before a title */
#cursor { left: 40px; top: 160px; width: 24px; height: 24px; font-family: "LXGW WenKai TC", serif; font-size: 16px;
  color: #E8631A; line-height: 24px; text-align: center; }
/* the small ▶ before a label and before the chosen menu item (.b .label::before, .b .menu li.on::before) */
#cursor_s { left: 70px; top: 160px; width: 16px; height: 16px; font-family: "LXGW WenKai TC", serif; font-size: 12px;
  color: #E8631A; line-height: 16px; text-align: center; }
/* button bar: 3px red-orange line on top of dark blue */
#barline { left: 100px; top: 160px; width: 8px; height: 3px; background: #B83A06; }
#barfill { left: 120px; top: 160px; width: 8px; height: 8px; background: #26305A; }
</style></head>
<body>
<div class="piece" id="sky"></div>
<div class="piece" id="frame"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>
<div class="piece" id="portrait"></div>
<div class="piece" id="cursor">▶</div>
<div class="piece" id="cursor_s">▶</div>
<div class="piece" id="barline"></div>
<div class="piece" id="barfill"></div>
</body></html>
